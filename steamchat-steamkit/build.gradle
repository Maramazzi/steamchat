// Real Steam backend: implements SteamService (steamchat-domain) using JavaSteam, a JVM port of
// SteamKit2 - proven working end-to-end (login, Steam Guard, friends, real-time messages) on
// Android in an early standalone spike (since removed). Kept as its own module so the heavy javasteam/bouncycastle dependencies
// don't leak into steamchat-domain's consumers (fake backend, unit tests, future UI tests).
apply plugin: 'org.jetbrains.kotlin.jvm'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':steamchat-domain')

    implementation 'in.dragonbra:javasteam:1.8.0'
    // Android's built-in BouncyCastle is stripped down; JavaSteam needs the full provider (confirmed in the early spike).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    // javasteam declares this as scope=runtime, so it's on our runtime classpath already but not
    // the compile one - needed explicitly here because we build/read a couple of protobuf
    // messages ourselves (FriendsLevelsHandler, owned-games request) instead of only going
    // through typed handler methods. Version must match javasteam's own POM.
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    // Only for parsing the tiny ajaxaliases response (SteamNameHistory.kt) - a regex would mishandle
    // escaped characters in arbitrary user-chosen persona names, unlike the HTML pages elsewhere in
    // this module where regex matches structural markup, not user-controlled string content. Same
    // version already used in TMessagesProj.
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    // CompletableFuture.await(), used to bridge JavaSteam's CompletableFuture-based auth API to suspend functions.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.11.0"

    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
